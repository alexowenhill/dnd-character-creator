[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js runtime handles the App Router, including the server-side
# route handlers, and provides the Blobs store that characters are saved to.
#
# PARTY_PASSWORD must be set under Site configuration -> Environment variables,
# or nobody can get in. See .env.example for the rest.
[[plugins]]
  package = "@netlify/plugin-nextjs"
